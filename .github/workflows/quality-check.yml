name: TermuxQ Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate browser app and Termux scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/termuxq-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/termuxq-inline.js

      - name: Validate shell script syntax
        run: |
          bash -n update_termuxq.sh
          bash -n start_termuxq_live.sh

      - name: Validate PWA manifest and required assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          required = ["index.html", "manifest.json", "sw.js", "termuxq_agent.py",
                      "update_termuxq.sh", "start_termuxq_live.sh",
                      "icon-192.png", "icon-512.png", "icon-maskable-512.png",
                      "apple-touch-icon.png"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          for item in manifest.get("icons", []):
              if not (root / item["src"]).is_file():
                  raise SystemExit("Manifest icon not found: " + item["src"])
          sw = (root / "sw.js").read_text(encoding="utf-8")
          for name in ["icon-192.png", "icon-512.png", "icon-maskable-512.png", "apple-touch-icon.png"]:
              if "./" + name not in sw:
                  raise SystemExit("Service worker does not cache " + name)
          print("Manifest JSON and PWA asset paths are valid.")
          PY

      - name: Check Python agent syntax and API safeguards
        run: |
          python3 -m py_compile termuxq_agent.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Supabase schema and notification guardrails
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          schema = Path("supabase/schema.sql").read_text(encoding="utf-8")
          migration = Path("supabase/migrations/20261013_ticket_workflow.sql").read_text(encoding="utf-8")
          fn_path = Path("supabase/functions/ticket-notify/index.ts")
          if not fn_path.is_file():
              raise SystemExit("Missing Telegram ticket-notify Edge Function")
          function = fn_path.read_text(encoding="utf-8")
          for record_type in ["'asset'", "'ticket'", "'audit'", "'setting'"]:
              if record_type not in schema or record_type not in migration:
                  raise SystemExit("Missing record type in schema/migration: " + record_type)
          for required in ["auth.getUser()", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "TELEGRAM_NOTIFY_ALLOWED_USER_IDS", "SUPABASE_SERVICE_ROLE_KEY", "termuxq_claim_notification_slot", "sendMessage"]:
              if required not in function:
                  raise SystemExit("Edge Function guardrail missing: " + required)
          for required in ["termuxq_notification_limits", "termuxq_claim_notification_slot", "1 minute", "20"]:
              if required.lower() not in (schema + migration + function).lower():
                  raise SystemExit("Telegram anti-abuse control missing: " + required)
          if re.search(r"\b\d{6,}:[A-Za-z0-9_-]{20,}\b", function):
              raise SystemExit("A Telegram bot token appears to be hard-coded")
          frontend = Path("index.html").read_text(encoding="utf-8")
          # Security guidance may mention service_role safely; only fail if a key-like literal is assigned.
          if re.search(r"""(?:service_role|SERVICE_ROLE_KEY)\s*[:=]\s*['"][^'"]{20,}['"]""", frontend, flags=re.I):
              raise SystemExit("A service_role credential appears to be hard-coded")
          team_path = Path("supabase/functions/team-admin/index.ts")
          if not team_path.is_file():
              raise SystemExit("Missing secure team-admin Edge Function")
          team = team_path.read_text(encoding="utf-8")
          for required in ["auth.getUser()", "termuxq_organization_members", "admin", "technician", "viewer", "inviteUserByEmail", "set_role"]:
              if required not in team:
                  raise SystemExit("Team access guardrail missing: " + required)
          workspace_migration = Path("supabase/migrations/20261014_workspace_roles.sql").read_text(encoding="utf-8")
          for required in ["termuxq_is_org_member", "termuxq_has_org_role", "record_type<>'setting'", "organization_id", "primary key"]:
              if required.lower() not in workspace_migration.lower():
                  raise SystemExit("Workspace RLS guardrail missing: " + required)
          print("Supabase schema, workspace role enforcement, and server-side notifications validated.")
          PY

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium for browser interaction tests
        run: npx playwright install --with-deps chromium

      - name: Run browser interaction tests
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/termuxq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/index.html >/dev/null
          node tests/browser-smoke.cjs
